<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>膀胱炎 セルフチェック</title>
  <style>
    /* === Layout (stone準拠) === */
    body {
      font-family: 'Segoe UI','Yu Gothic','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
      background:#f7f9fa; margin:0; padding:0;
    }
    .container {
      background:#fff; max-width:720px; margin:3em auto 0;
      box-shadow:0 4px 24px rgba(0,0,0,.08);
      border-radius:16px; padding:2.2em 2.2em 1.2em;
    }
    h1 {
      font-size:1.45em; color:#205a6a; margin-bottom:1em;
      text-align:center; letter-spacing:.05em; font-weight:bold;
    }
    .intro { font-size:1em; color:#444; margin-bottom:2em; text-align:center; line-height:1.7; }

    .question { margin:1.65em 0; }
    .question label { display:flex; align-items:center; }
    .question input[type="checkbox"] {
      flex:0 0 1.7em; margin:0 1em 0 0; accent-color:#30b2c7; transform:scale(1.22);
    }
    .question span {
      flex:1 1 auto; font-size:1.16em; font-weight:bold;
      color:#242e34; line-height:1.6; display:inline-block;
    }
    .long-question label { align-items:baseline !important; }
    .long-question input[type="checkbox"] { margin-top:0 !important; margin-bottom:0; }

    .btns { display:flex; gap:1em; justify-content:center; margin-top:2.5em; }
    .btn, .reset-btn, button {
      padding:.78em 5em; font-size:1.1em; border:none; border-radius:1.7em;
      background:#30b2c7; color:#fff; cursor:pointer; font-weight:bold;
      box-shadow:0 2px 8px rgba(48,178,199,.10); transition:background .2s;
      letter-spacing:.06em; text-decoration:none; display:inline-block; text-align:center;
    }
    .btn:hover { background:#2192a6; }
    .reset-btn { background:#ececec; color:#444; }
    .reset-btn:hover { background:#d2d2d2; color:#1d1d1d; }

    .note { color:#8fa9b8; font-size:1.05em; margin-top:1.5em; text-align:center; line-height:1.7; padding:0.5em 1.02em; }
    .hospital-name { text-align:center; color:#6a7a86; font-size:1.1em; margin-top:1.4em; margin-bottom:.3em; letter-spacing:.06em; font-weight:bold; }

    /* 一覧に戻るボタン：アウトライン＆四角 */

.back-list-btn,
.back-home{
  display:inline-block;
  text-decoration:none;
  text-align:center;
  font-weight:800;
  /* 角丸を小さく（四角寄り） */
  border-radius:8px;

  /* アウトライン化（やり直しと差別化） */
  background:#fff;               /* 白地 */
  color:#205a6a;                 /* 文字は濃いブルー系 */
  border:2px solid #9bbdca;      /* 薄青の枠線 */

  padding:.55em 1.6em;
  transition:background .2s, color .2s, border-color .2s, box-shadow .2s;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.back-list-btn:hover,
.back-home:hover{
  background:#f5fafb;            /* うっすら水色 */
  border-color:#5da5ba;          /* 枠を少し濃く */
  color:#1b4856;
}
.back-list-btn:focus-visible,
.back-home:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(48,178,199,.25);  /* フォーカスリング */
}

/* PC幅をそろえたい場合（任意） */
@media (min-width:601px){
  .back-list-btn,
  .back-home{
    display:block;
    width:320px;           /* 他ボタンと同幅にしたいなら維持 */
    margin:.9em auto 0;
    box-sizing:border-box;
  }
}
/* スマホはフル幅 */
@media (max-width:600px){
  .back-list-btn,
  .back-home{
    display:block;
    width:auto;
  }
}


    @media (max-width:600px){
      .container{ max-width:88vw; padding:1.2em .5em 1em; border-radius:10px; }
      h1{ font-size:1.5em; margin-bottom:.8em; }
      .intro{ font-size:.99em; text-align:left; margin-bottom:1.5em; padding:0 1.3em; }
      .question{ margin:1em 0; margin-left:.8em; margin-right:.8em; }
      .question label{ align-items:flex-start !important; }
      .question input[type="checkbox"]{
        margin-top: var(--chk-top, 0.46em) !important;
        margin-bottom:0; margin-right:1em;
        flex:0 0 1.35em; width:1.35em; height:1.35em; transform:scale(1.09);
      }
      .question span{ font-size:1.05em; font-weight:bold; line-height:1.55; word-break:break-word; }
      .btns{ flex-direction:column; gap:.7em; margin-top:2em; }
      .btn, .reset-btn{ width:100%; font-size:1.08em; padding:1.15em 0; border-radius:999px; }
      .note {
        font-size: .99em;
        padding-bottom: .5em;
        margin-bottom: 1em;
        text-align: left;
    }
      .hospital-name{ font-size:.99em; padding-bottom:.5em; }
    }

    
  </style>
</head>
<body
  data-title="膀胱炎 セルフチェック"
  data-result="result.html"
  data-threshold="1"
  data-dept-name="泌尿器科"
  data-dept-url="https://tokyoyamato-hp.com/dept/normal/hinyoukika/"
  data-dept-min="1"
  data-messages='[
    {"min":0,"max":0,"text":"今回のチェックでは当てはまる項目はありませんでした。気になる症状が続く場合は医療機関にご相談ください。"},
    {"min":1,"text":"一つでも上記症状があてはまる場合、疾患に罹患している可能性があります。一度、ご受診をお勧めいたします。"}
  ]'
  style="--chk-top:0.46em"
>
  <div class="container">
    <h1>膀胱炎セルフチェック</h1>

    <div class="intro">
      膀胱におきる炎症のことです。<br>
      簡易的な質問にお答えいただくと、受診した方が良いかの目安になります。
    </div>

    <form id="selfcheck" onsubmit="event.preventDefault();">
      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>急に排尿の回数が増えた</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>さっき行ったばかりなのに、もうトイレに行きたい</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>排尿し終える頃に、ツーンとした痛みやムズムズ感がある</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>排尿後も尿が残った感じがしてスッキリしない</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>過去にも同じ症状を経験したことがある</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>尿が白く濁っている</span>
      </label></div>

      <div class="question"><label>
        <input type="checkbox" name="q" value="1">
        <span>尿に血が混じっている</span>
      </label></div>

      <div class="btns">
        <button type="button" class="btn" data-action="judge">判定する</button>
        <button type="button" class="reset-btn" data-action="reset">やり直し</button>
      </div>
    </form>

    <div class="note">
      ※該当するものがあればチェックを入れてください。<br>
      判定ボタンを押すと、結果ページに移動します。<br>
    </div>
    <div class="back-home-wrap">
    <a class="back-home" href="index.html">健康セルフチェック一覧に戻る</a>
    </div>

    <footer class="hospital-name">明理会東京大和病院</footer>
  </div>

  <script src="assets/selfcheck.js"></script>
</body>
</html>
