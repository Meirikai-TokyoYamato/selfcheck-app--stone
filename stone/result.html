<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セルフチェック結果 | 腎・尿路結石</title>
  <style>
    body{
      font-family:'Segoe UI','Yu Gothic','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
      background:#f7f9fa;margin:0;padding:0;
    }
    .container{
      background:#fff;max-width:480px;margin:4em auto 0;
      box-shadow:0 4px 24px rgba(0,0,0,.08);
      border-radius:14px;padding:2em 2em 1.2em;text-align:center;
    }
    h1{font-size:1.35em;color:#30b2c7;margin-bottom:1.2em;}

    /* 結果メッセージ */
    .result{
      font-size:1.17em;color:#205a6a;line-height:1.7;
      max-width:95%;margin:0.8em auto 1.5em;text-align:left;
    }

    /* 診療科導線 */
    .dept-label{
      margin-top:1.2em;
      margin-bottom:.8em;        /* ← ラベルと青ボタンの間を広げる */
      font-weight:700;color:#205a6a;
    }
    .dept-btn{
      display:inline-block;background:#30b2c7;color:#fff;text-decoration:none;
      font-weight:700;padding:.72em 1.8em;border-radius:1.3em;white-space:nowrap;
      transition:background .2s;
    }
    .dept-btn:hover{background:#2192a6;}

    /* もう一度ボタン */
    .btn-back{
      margin-top:1.4em;background:#ececec;color:#444;border-radius:999px;border:none;
      padding:.9em 2em;font-size:1em;cursor:pointer;transition:background .2s;
    }
    .btn-back:hover{background:#d2d2d2;}

    /* 注意書き（PCは2行程度におさめる） */
    .note{
      color:#555;line-height:1.7;margin:1.6em auto .6em;
      max-width:420px; /* ← PCで2行前後にするため幅を制御 */
      text-align:center;font-size:.97em;
    }

    /* コピーライト */
    .hospital-name{
      text-align:center;color:#6a7a86;font-size:.85em;margin:3.9em 0 .9em;letter-spacing:.05em;
    }

    @media (min-width: 601px) {
    /* 幅を完全一致させる（padding込みで320px） */
    .dept-btn,
    .btn-back {
      display: block;
      width: 320px;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;   /* ←これ重要！ */
      padding: 0.9em 0;         /* ←左右paddingを0にして高さだけ揃える */
      border-radius: 999px;
      text-align: center;
    }
    .dept-btn { margin-top: 0.9em; }  /* 位置の微調整だけ残す */
  }


    /* PCでボタン幅を統一（中央）＆注意文の孤立改行を抑制 */
    @media (min-width:601px){
      .dept-btn,
      .btn-back{
        display:block;
        width:320px;          /* ← 同じ幅に揃える（必要なら300〜360で微調整） */
        margin-left:auto;
        margin-right:auto;
      }
      .dept-btn{ margin-top:.9em; }
      .note{
        max-width:460px;      /* ← 少し広げて末尾だけ落ちるのを回避しやすく */
        text-wrap: balance;   /* ← 対応ブラウザで改行をバランス良く */
      }
    }

    /* スマホ最適化 */
    @media (max-width:600px){
      .container{max-width:95vw;padding:1.2em 1em;border-radius:12px;}
      h1{font-size:1.28em;margin-bottom:.9em;}
      .result{font-size:1.05em;max-width:100%;text-align:left;margin-bottom:1.2em;}
      .dept-label{margin-top:.8em;}
      .dept-btn{display:block;width:100%;box-sizing:border-box;border-radius:999px;}
      .btn-back{width:100%;padding:1em 0;font-size:1.05em;margin-top:1.1em;}
      .note{max-width:86%;font-size:.95em;margin-top:1.1em;}
      .hospital-name {margin: 3em 0 0.9em;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>セルフチェック結果</h1>

    <div class="result" id="result"></div>

    <!-- score>=1 で診療科導線を表示 -->
    <div id="deptBox" style="display:none;">
      <div class="dept-label" id="deptTitle">当院での該当診療科</div> 
      <a id="deptLink" class="dept-btn" href="#" target="_blank" rel="noopener">泌尿器科ページへ</a>
    </div>

    <button class="btn-back" onclick="location.href='index.html'">もう一度チェックする</button>

    <div class="note">
      ※このチェックはあくまで目安です。<br>
      気になる症状が続く場合は、必ず医療機関へご相談ください。
    </div>

    <footer class="hospital-name">© Meirikai Tokyo Yamato Hospital</footer>
    </div>

  <script>
    // score取得
    const score = parseInt(new URLSearchParams(location.search).get('score') || '0',10);

    // メッセージ
    const resultEl = document.getElementById('result');
    resultEl.textContent = (score===0)
      ? '今のところ大きな問題はなさそうです。気になる症状があればご相談ください。'
      : '1個でも当てはまる方は要注意です。一度病院に受診してみてもいいかもしれません。';

    // 診療科リンク（score>=1 の時のみ）
    if(score>=1){
      const deptBox  = document.getElementById('deptBox');
      const deptLink = document.getElementById('deptLink');
      const deptTitle= document.getElementById('deptTitle');

      const deptName = '泌尿器科';
      const deptUrl  = 'https://tokyoyamato-hp.com/dept/normal/hinyoukika/?utm_source=selfcheck&utm_medium=web&utm_campaign=stone'; 

      deptBox.style.display = 'block';
      deptTitle.textContent = `当院での該当診療科：${deptName}`;
      deptLink.textContent  = `${deptName}ページへ`;
      deptLink.href         = `${deptUrl}?utm_source=selfcheck&utm_medium=web&utm_campaign=stone`;
    }
  </script>
</body>
</html>
