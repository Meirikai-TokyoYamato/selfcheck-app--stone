      </label></div>

      </label></div>
      <div class="question long-question"><label>
        <input type="checkbox" name="q" value="1">
        <span>いったん頭痛が起こると仕事や家事に支障が起こる</span>
      </label></div>
      <div class="question long-question"><label>
        <input type="checkbox" name="q" value="1">
        <span>頭痛に対して市販の痛み止めを飲んでいるが、あまり効果がない</span>
      </label></div>
      <div class="question long-question"><label>
        <input type="checkbox" name="q" value="1">
        <span>頭痛が起こる前に視野にチカチカした光やギザギザした光が見えたり、視野が欠けたりするなど、視界に関する異常がある</span>
      </label></div>
      <div class="question"><label>
